name: Test and Deploy Task Manager API to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1-BOSQICH: Lint va PostgreSQL bilan avtomatik testlar
  test:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: task_user
          POSTGRES_PASSWORD: task_password
          POSTGRES_DB: task_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-for-github-actions-task-manager
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
      POSTGRES_DB: task_test_db
      TEST_POSTGRES_DB: task_test_db

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Kerakli kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kod sifati va Sintaksisni tekshirish (Flake8)
        run: |
          flake8 app tests

      - name: Pytest bilan testlarni yurgizish
        run: |
          pytest -v --cov=app

  # 2-BOSQICH: Agar testlar muvaffaqiyatli o'tsagina, Serverga avtomatik yuklash
  deploy:
    name: Deploy to AWS EC2
    needs: test  # <-- Testlar o'tmaguncha deploy boshlanmaydi!
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Connect and deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/task-manager-api
            git pull origin main
            chmod +x deploy.sh
            ./deploy.sh
