# Nginx Reverse Proxy konfiguratsiyasi namuna fayli.
# NIMA UCHUN KERAK:
# Tashqi foydalanuvchilarning 80-port (HTTP) dagi so'rovlarini qabul qilib,
# ichkarida ishlayotgan FastAPI (Uvicorn - 8000 port) ilovasiga yo'naltiradi.

server {
    listen 8080;
    server_name _;  # Serverning IP manzili yoki domen nomi

    client_max_body_size 10M;

    # Barcha so'rovlarni ichki Uvicorn backend serveriga yo'naltirish
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # Real mijoz IP manzili va sarlavhalarini saqlab qolish
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket qo'llab-quvvatlashi
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Loglar saqlanadigan joy
    access_log /var/log/nginx/taskmanager_access.log;
    error_log /var/log/nginx/taskmanager_error.log;
}
